name: PolyMath
description: |
  PolyMath is a comprehensive mathematical DSL (Domain Specific Language) for Kotlin that lets you write 
  mathematical expressions naturally and evaluate them or render them as LaTeX. PolyMath supports multiple 
  fields of mathematics with an intuitive, type-safe API including arithmetic, algebra, calculus, 
  trigonometry, combinatorics, boolean logic, unit conversions, and advanced mathematical domains. 
  It features proper order of operations, rational number arithmetic, LaTeX rendering, and extensive 
  unit conversion systems for metric, imperial, and specialized measurement systems.
language: kotlin
tags:
  - kotlin
  - mathematics
  - dsl
  - latex
  - algebra
  - calculus
  - trigonometry
  - unit-conversion
  - typesafe
  - library
  - scientific-computing
  - education
  - research
  - engineering
  - physics
  - statistics
  - combinatorics
  - boolean-logic
  - rational-numbers
  - graphviz

release_branch: develop
has_release_script: true
release_repo: patbeagan1/PolyMath

subtree:
  repo: git@github.com:patbeagan1/PolyMath.git
  prefix: PolyMath
  branch: develop

scripts:
  build:
    command: ./gradlew build
  test:
    command: ./gradlew test
  run:
    command: ./gradlew run
  publish:
    command: ./gradlew publishToMavenLocal

