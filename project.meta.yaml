roadmap:
  todo:
  - Establish domain-driven design as the primary organizing principle for scientific coding—bounded contexts, ubiquitous language, aggregates, and anti-corruption layers between shared math kernels and domain-specific science code
  - Make domain-centric scientific coding the default experience—APIs, types, and documentation should read in the vocabulary of each field so practitioners work with their own models, not generic math unless they choose to
  - Cover all scientific domains systematically—grow first-class modules and examples across physics, chemistry, biology, earth and environmental science, astronomy, materials science, engineering disciplines, statistics, and emerging cross-disciplinary domains, not only classical mathematics
  - Define repeatable patterns for new domains—scaffolding, naming, units, validation, and tests so each scientific area can evolve independently while staying consistent with shared physical and mathematical foundations
  - Strengthen cross-domain consistency—dimensional analysis, unit algebra, and safe conversions when models combine quantities from multiple sciences in one program
  - Ship reference domain models that showcase DDD layering (entities, value objects, domain services, factories) on top of PolyMath’s existing modular math and units stack
  - Add support for complex number arithmetic and operations
  - Implement symbolic differentiation and integration
  - Add support for matrix operations and linear algebra
  - Create interactive Jupyter notebook examples oriented toward domain workflows and reproducible science
  - Add support for statistical distributions and probability
  - Implement graph theory algorithms and visualizations
  - Add support for differential equations
  - Create web-based mathematical expression editor
  - Add support for 3D geometry and spatial mathematics
  - Implement numerical methods and approximations
  - Add support for mathematical optimization
  - Create educational tutorials and interactive examples
  - Add support for mathematical proof verification
  - Implement advanced LaTeX rendering with custom styles
  - Add support for mathematical notation input (MathML, AsciiMath)
  - Create mobile applications for mathematical calculations
  - Add support for mathematical modeling and simulation
  - Implement collaborative mathematical document editing
  - Add support for mathematical data visualization
  - Create integration with popular mathematical software (Mathematica, MATLAB)
  - Improving unit conversion system with more measurement units
  - Enhancing LaTeX rendering capabilities
  - Export to typst
  - Adding more comprehensive test coverage
  - Optimizing performance for large mathematical expressions
  - Improving documentation and examples with a domain-first narrative across scientific fields
  in_progress:
  done:
  - Core mathematical DSL implementation with type-safe operations
  - Basic arithmetic with proper order of operations (PEMDAS/BODMAS)
  - Variable and equation support with dynamic and static variables
  - Rational number arithmetic with exact fraction calculations
  - Trigonometric functions (sin, cos, tan, arcsin, arccos, arctan)
  - Logarithmic and exponential functions
  - Summation and product notation (Sigma and Pi)
  - Combinatorics (permutations, combinations, factorials)
  - Boolean logic and propositional calculus
  - LaTeX rendering for mathematical notation
  - Unit conversion system with metric, imperial, and specialized units
  - Mathematical domain dictionaries (algebra, calculus, statistics, physics)
  - Expression simplification and evaluation
  - Mathematical constants and physical constants
  - Graphviz visualization for mathematical expressions
  - Comprehensive test suite with mathematical verification
  - Multi-platform Kotlin support (JVM, JS, Native)
  - Modular architecture with separate modules for different mathematical domains
  - Discrete signal processing (convolution, correlation, DFT/FFT, windows, energy/RMS) with typed sampling
