name: PolyMath
description: "PolyMath is a comprehensive mathematical DSL (Domain Specific Language) for Kotlin that lets you write \nmathematical expressions naturally and evaluate them or render them as LaTeX. PolyMath supports multiple \nfields of mathematics with an intuitive, type-safe API including arithmetic, algebra, calculus, \ntrigonometry, combinatorics, boolean logic, unit conversions, discrete signal processing with \ndomain-driven sampling types, and advanced mathematical domains. \nIt features proper order of operations, rational number arithmetic, LaTeX rendering, and extensive \nunit conversion systems for metric, imperial, and specialized measurement systems.\n"
language: kotlin
tags:
- kotlin
- mathematics
- dsl
- latex
- algebra
- calculus
- trigonometry
- unit-conversion
- typesafe
