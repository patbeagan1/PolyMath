name: PolyMath
description: "PolyMath is a comprehensive mathematical DSL (Domain Specific Language) for Kotlin that lets you write \nmathematical expressions naturally and evaluate them or render them as LaTeX. PolyMath supports multiple \nfields of mathematics with an intuitive, type-safe API including arithmetic, algebra, calculus, \ntrigonometry, combinatorics, boolean logic, unit conversions, discrete signal processing with \ndomain-driven sampling types, and advanced mathematical domains. \nIt features proper order of operations, rational number arithmetic, LaTeX rendering, and extensive \nunit conversion systems for metric, imperial, and specialized measurement systems.\n"
language: kotlin
tags:
- kotlin
- mathematics
- dsl
- latex
- algebra
- calculus
- trigonometry
- unit-conversion
- typesafe
- library
- scientific-computing
- signal-processing
- education
- research
- engineering
- physics
- statistics
- combinatorics
- boolean-logic
- rational-numbers
- graphviz
subtree:
  repo: git@github.com:patbeagan1/PolyMath.git
  prefix: PolyMath
  branch: develop
scripts:
  build:
    command: ./gradlew build
  test:
    command: ./gradlew test
  run:
    command: ./gradlew run
  publish:
    command: ../monorepo subtree push PolyMath
  pull:
    command: ../monorepo subtree pull PolyMath
  publish-units-base:
    command: ./gradlew :units-base:publishToMavenLocal
  publish-units-common:
    command: ./gradlew :units-common:publishToMavenLocal
  publish-units-data:
    command: ./gradlew :units-data:publishToMavenLocal
  publish-math-base:
    command: ./gradlew :math-base:publishToMavenLocal
  publish-math-algebra:
    command: ./gradlew :math-algebra:publishToMavenLocal
  publish-math-geometry:
    command: ./gradlew :math-geometry:publishToMavenLocal
  publish-physics-classical:
    command: ./gradlew :physics-classical:publishToMavenLocal
  publish-signal-processing:
    command: ./gradlew :signal-processing:publishToMavenLocal
  publish-latex-builder:
    command: ./gradlew :latex-builder:publishToMavenLocal
  publish-lib-graph:
    command: ./gradlew :lib-graph:publishToMavenLocal
  publish-units-base-central:
    command: ./gradlew :units-base:publishAllPublicationsToMavenCentralRepository
  publish-units-common-central:
    command: ./gradlew :units-common:publishAllPublicationsToMavenCentralRepository
  publish-units-data-central:
    command: ./gradlew :units-data:publishAllPublicationsToMavenCentralRepository
  publish-math-base-central:
    command: ./gradlew :math-base:publishAllPublicationsToMavenCentralRepository
  publish-math-algebra-central:
    command: ./gradlew :math-algebra:publishAllPublicationsToMavenCentralRepository
  publish-math-geometry-central:
